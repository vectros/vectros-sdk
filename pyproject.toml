[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectros"
version = "2.0.0"
description = "Build AI agents that run on the AIOS kernel (Vectros OS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vectros = "vectros.cli:main"

[tool.setuptools.packages.find]
include = ["vectros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["kernel: needs a loaded aios.ko, libaios.so and running workers"]
